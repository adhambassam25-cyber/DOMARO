name: Optimize product images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-product-images.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pillow requests
      - name: Build lossless WebP copies
        run: |
          python - <<'PY'
          from PIL import Image
          import io, json, os, requests

          items = [
            ("ibraq-mini-diamond-collection","https://zuqjxcsjjgotwwmlvxmf.supabase.co/storage/v1/object/public/products/ibraq-mini-diamond-collection/1790984785953-ibraq-mini-diamond-collection-1.png"),
            ("nude-coral-diamond","https://zuqjxcsjjgotwwmlvxmf.supabase.co/storage/v1/object/public/products/nude-coral-diamond/1791219347021-nude-coral-diamond.png"),
            ("purple-heart-diamond","https://zuqjxcsjjgotwwmlvxmf.supabase.co/storage/v1/object/public/products/purple-heart-diamond/1790285186677-e49fd759-3902-497a-a7c8-482108b7bbf9-1000x1000-h529rrj8vqfeutvpb9cttmgzdq0xdhpewdaj865p.png"),
            ("black-diamond-incense","https://zuqjxcsjjgotwwmlvxmf.supabase.co/storage/v1/object/public/products/black-diamond-incense/1790285018271-6c2445b0-1af6-4cb1-a0c5-49a559deb7d1-1000x1000-ylkl2xoupxu6ccsochhf6xv039ggahlnbd9fixzu-1-.png"),
            ("pink-diamond-sakura","https://zuqjxcsjjgotwwmlvxmf.supabase.co/storage/v1/object/public/products/pink-diamond-sakura/1790285692970-1f6a6c6a-7a0f-4a1c-b786-4def8772dc4e-1000x1000-oucgyn9062i3awgedu7210vl7y4ma4riemek7p0x.png"),
            ("hook-blue","https://zuqjxcsjjgotwwmlvxmf.supabase.co/storage/v1/object/public/products/hook-blue/1790529160767-hook-blue.png"),
            ("frankel-black-elixir","https://zuqjxcsjjgotwwmlvxmf.supabase.co/storage/v1/object/public/products/frankel-black-elixir/1790529190984-frankel-black-elixir.png"),
            ("wild-colt-elixir","https://zuqjxcsjjgotwwmlvxmf.supabase.co/storage/v1/object/public/products/wild-colt-elixir/1791213663531-teal-elixir-perfume-bottle.webp"),
            ("gris-erik","https://zuqjxcsjjgotwwmlvxmf.supabase.co/storage/v1/object/public/products/gris-erik/1790529319638-gris-erik-200ml-.png"),
            ("musk-al-layl","https://zuqjxcsjjgotwwmlvxmf.supabase.co/storage/v1/object/public/products/musk-al-layl/1790356804983-chatgpt-image-sep-25-2026-08-19-21-pm.png"),
            ("signature-silver","https://zuqjxcsjjgotwwmlvxmf.supabase.co/storage/v1/object/public/products/signature-silver/1790342308958-silver.png"),
            ("golden-sheikh-zayed-zayed","https://zuqjxcsjjgotwwmlvxmf.supabase.co/storage/v1/object/public/products/golden-sheikh-zayed-zayed/1790343118924-zayed.png"),
            ("dangerous-arrogate","https://zuqjxcsjjgotwwmlvxmf.supabase.co/storage/v1/object/public/products/dangerous-arrogate/1790530416067-dangerous-arrogate.png"),
            ("pink-queen","https://zuqjxcsjjgotwwmlvxmf.supabase.co/storage/v1/object/public/products/pink-queen/1790701355591-pink-queen.png"),
            ("special-musk","https://zuqjxcsjjgotwwmlvxmf.supabase.co/storage/v1/object/public/products/special-musk/1790801814015-special-musk.png"),
            ("abaq-pomegranate-musk","https://zuqjxcsjjgotwwmlvxmf.supabase.co/storage/v1/object/public/products/abaq-pomegranate-musk/1790801897393-abaq-pomegranate-musk.png"),
            ("musk-al-qamar","https://zuqjxcsjjgotwwmlvxmf.supabase.co/storage/v1/object/public/products/musk-al-qamar/1790801949588-musk-al-qamar.png"),
            ("musk-al-shams","https://zuqjxcsjjgotwwmlvxmf.supabase.co/storage/v1/object/public/products/musk-al-shams/1790802012662-musk-al-shams.png"),
            ("powder-musk","https://zuqjxcsjjgotwwmlvxmf.supabase.co/storage/v1/object/public/products/powder-musk/1790802085047-powder-musk.png"),
            ("musk-fajr","https://zuqjxcsjjgotwwmlvxmf.supabase.co/storage/v1/object/public/products/musk-fajr/1790802136448-musk-fajr.png"),
            ("aura","https://zuqjxcsjjgotwwmlvxmf.supabase.co/storage/v1/object/public/products/aura/1790803114331-aura.png"),
            ("tiamo","https://zuqjxcsjjgotwwmlvxmf.supabase.co/storage/v1/object/public/products/tiamo/1790803153928-tiamo.png"),
            ("private-2-december","https://zuqjxcsjjgotwwmlvxmf.supabase.co/storage/v1/object/public/products/private-2-december/1790803197466-private-2-december.png"),
            ("wild-colt-bakhur","https://zuqjxcsjjgotwwmlvxmf.supabase.co/storage/v1/object/public/products/wild-colt-bakhur/1790803454949-wild-colt-bakhur.png"),
            ("crown-spirit","https://zuqjxcsjjgotwwmlvxmf.supabase.co/storage/v1/object/public/products/crown-spirit/1790983026372-crown-spirit-perfume-bottle-studio-shot.png"),
          ]

          outdir="assets/products-optimized"
          os.makedirs(outdir, exist_ok=True)
          report=[]
          session=requests.Session()

          for pid,url in items:
              r=session.get(url, timeout=60)
              r.raise_for_status()
              original=r.content
              img=Image.open(io.BytesIO(original))
              img.load()
              buf=io.BytesIO()
              img.save(buf, format="WEBP", lossless=True, method=6)
              optimized=buf.getvalue()
              verify=Image.open(io.BytesIO(optimized))
              verify.load()
              identical=(img.mode==verify.mode and img.size==verify.size and img.tobytes()==verify.tobytes())
              use_local=identical and len(optimized) < len(original)
              if use_local:
                  with open(f"{outdir}/{pid}.webp","wb") as f:
                      f.write(optimized)
              report.append({
                  "id":pid,
                  "source_url":url,
                  "width":img.width,
                  "height":img.height,
                  "mode":img.mode,
                  "original_bytes":len(original),
                  "optimized_bytes":len(optimized),
                  "saved_percent":round((len(original)-len(optimized))*100/len(original),2),
                  "pixels_identical":identical,
                  "use_local":use_local,
                  "local_path":f"/assets/products-optimized/{pid}.webp" if use_local else None,
              })

          with open(f"{outdir}/report.json","w",encoding="utf-8") as f:
              json.dump(report,f,indent=2)

          assert all(x["pixels_identical"] for x in report), "Pixel verification failed"
          print(json.dumps(report, indent=2))
          PY
      - name: Commit optimized files
        run: |
          git config user.name "domaro-image-optimizer"
          git config user.email "actions@users.noreply.github.com"
          git add assets/products-optimized
          if git diff --cached --quiet; then
            echo "No smaller lossless images produced."
            exit 0
          fi
          git commit -m "Add lossless optimized product images"
          git push
