<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DOMARO Meta Pixel Diagnostic</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    body{font-family:Arial,sans-serif;background:#f6f2ec;color:#111;margin:0;padding:24px}
    .card{max-width:720px;margin:40px auto;background:#fff;border:1px solid #ddd;padding:24px;border-radius:16px}
    h1{font-size:24px;margin:0 0 18px}
    .row{padding:12px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between;gap:16px}
    .ok{color:#087a3e;font-weight:700}.bad{color:#b42318;font-weight:700}.wait{color:#8a6d1d;font-weight:700}
    button{margin-top:20px;padding:12px 18px;border:0;background:#111;color:#fff;border-radius:8px;cursor:pointer}
    code{word-break:break-all}
  </style>
</head>
<body>
  <div class="card">
    <h1>DOMARO Meta Pixel Diagnostic</h1>
    <div class="row"><span>Pixel ID</span><code>1070949589184839</code></div>
    <div class="row"><span>Meta script</span><span id="script-status" class="wait">Checking…</span></div>
    <div class="row"><span>fbq function</span><span id="fbq-status" class="wait">Checking…</span></div>
    <div class="row"><span>Direct tracking request</span><span id="request-status" class="wait">Checking…</span></div>
    <div class="row"><span>PageView queued</span><span id="event-status" class="wait">Checking…</span></div>
    <button id="send-test" type="button">SEND TEST EVENT AGAIN</button>
  </div>

  <script>
    const PIXEL='1070949589184839';
    const set=(id,text,ok)=>{
      const el=document.getElementById(id);
      el.textContent=text;
      el.className=ok===true?'ok':ok===false?'bad':'wait';
    };

    !function(f,b,e,v,n,t,s){
      if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];
      t=b.createElement(e);t.async=!0;t.src=v;
      t.onload=()=>set('script-status','LOADED ✅',true);
      t.onerror=()=>set('script-status','BLOCKED / FAILED ❌',false);
      s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)
    }(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');

    try{
      fbq('init',PIXEL);
      fbq('track','PageView');
      fbq('trackCustom','DOMAROTest',{source:'diagnostic'});
      set('fbq-status',typeof fbq==='function'?'READY ✅':'MISSING ❌',typeof fbq==='function');
      set('event-status','SENT / QUEUED ✅',true);
    }catch(e){
      set('fbq-status','ERROR ❌',false);
      set('event-status','ERROR ❌',false);
    }

    function directRequest(){
      const img=new Image(1,1);
      const ts=Date.now();
      img.onload=()=>set('request-status','REQUEST LOADED ✅',true);
      img.onerror=()=>set('request-status','BLOCKED / FAILED ❌',false);
      img.src='https://www.facebook.com/tr?id='+encodeURIComponent(PIXEL)+'&ev=PageView&noscript=1&dl='+encodeURIComponent(location.href)+'&ts='+ts;
    }
    directRequest();

    document.getElementById('send-test').addEventListener('click',()=>{
      try{
        if(typeof fbq==='function'){
          fbq('trackCustom','DOMAROTest',{source:'manual-button',ts:Date.now()});
          fbq('track','PageView');
          set('event-status','SENT AGAIN ✅',true);
        }
      }catch(e){ set('event-status','ERROR ❌',false); }
      directRequest();
    });

    setTimeout(()=>{
      if(document.getElementById('script-status').textContent==='Checking…') set('script-status','NO RESPONSE ❌',false);
      if(document.getElementById('request-status').textContent==='Checking…') set('request-status','NO RESPONSE ❌',false);
    },8000);
  </script>
</body>
</html>
